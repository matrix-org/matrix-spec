openapi: 3.1.0
info:
  title: Matrix Client-Server Delayed Events API
  version: 1.0.0
paths:
  "/v3/rooms/{roomId}/delayed_event/{eventType}/{txnId}":
    put:
      x-addedInMatrixVersion: "1.20"
      summary: Schedule an event to be sent to the given room at a later time.
      description: |-
        Schedules an event to be sent into a room by the homeserver after a delay.

        Homeservers MUST validate that the event is well-formed and SHOULD verify
        that the event could be sent at scheduling time. In particular, homeservers
        SHOULD check that the sender is joined to the room. If the request is rejected
        due to either of these checks failing, the homeserver MUST respond with the
        same HTTP status code and [standard error response](#standard-error-response)
        that would have been given on
        [`PUT /rooms/{roomId}/send/{eventType}/{txnId}`](/client-server-api/#put_matrixclientv3roomsroomidsendeventtypetxnid)
        or [`PUT /rooms/{roomId}/state/{eventType}/{stateKey}`](/client-server-api/#put_matrixclientv3roomsroomidstateeventtypestatekey).

        Homeservers do not need to re-evaluate whether the scheduled delayed events
        is still authorised when the room's state changes later. Instead, this check
        only happens again when [sending the delayed event](/client-server-api/#sending-delayed-events).
      operationId: scheduleDelayedEvent
      security:
        - accessTokenBearer: []
      parameters:
        - in: path
          name: roomId
          description: The room to send the event to.
          required: true
          example: "!636q39766251:example.com"
          schema:
            type: string
            format: mx-room-id
            pattern: "^!"
        - in: path
          name: eventType
          description: The type of event to send.
          required: true
          example: m.room.message
          schema:
            type: string
        - in: path
          name: txnId
          description: |-
            The [transaction ID](/client-server-api/#transaction-identifiers) for this request.
          required: true
          example: "35"
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delay_ms:
                  type: integer
                  format: int64
                  minimum: 1
                  description: |-
                    The number of milliseconds that the homeserver should wait
                    before sending the event. MUST be larger than `0`.
                  example: 60000
                state_key:
                  type: string
                  description: |-
                    The state key of the event to send, if it is a state event.
                content:
                  type: object
                  description: |-
                    The content of the event to send.
                  example: {
                    "msgtype": "m.text",
                    "body": "hello"
                  }
              required:
                - delay_ms
                - content
        required: true
      responses:
        "200":
          description: The delayed event has been scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delay_id:
                    type: string
                    description: |-
                      An [opaque identifier](/appendices/#opaque-identifiers) for the
                      delayed event generated by the homeserver.

                      Note that this is *not* the [event ID](/appendices/#event-ids) of
                      the event that may eventually be sent.
                required:
                  - delay_id
              examples:
                response:
                  value: {
                    "delay_id": "1234567890"
                  }
        "400":
          description: |-
            The request is invalid. A [standard error response](/client-server-api/#standard-error-response)
            will be returned with one of the following error codes:

            - `M_BAD_JSON`: The request body is invalid, e.g. due to a missing property value or a
              missing required property.
            - `M_MISSING_PARAM`: A required property is missing from the request body. Servers MAY
              also use `M_BAD_JSON` in this case.
            - `M_INVALID_PARAM`: A property of the request is set to an invalid value. Servers MAY
              also use `M_BAD_JSON` in this case.
            - `M_DELAY_TOO_LARGE`: The requested `delay_ms` exceeds the maximum allowed delay
              advertised in the [`m.delayed_events`](/client-server-api/#mdelayed_events-capability)
              capability.
          content:
            application/json:
              schema:
                $ref: definitions/errors/error.yaml
              examples:
                response:
                  value: {
                    "errcode": "M_DELAY_TOO_LARGE",
                    "error": "The requested delay exceeds the allowed maximum."
                  }
        "403":
          description: |-
            Delayed events are disabled on the homeserver.
          content:
            application/json:
              schema:
                $ref: definitions/errors/error.yaml
              examples:
                response:
                  value: {
                    "errcode": "M_FORBIDDEN",
                    "error": "Delayed events are not enabled on this homeserver."
                  }
        "429":
          description: |-
            The request was rate-limited, or scheduling the delayed event would exceed the
            maximum number of delayed events that the user may have scheduled at once, as
            advertised in the [`m.delayed_events`](/client-server-api/#mdelayed_events-capability)
            capability.

            In the latter case, the `errcode` MUST be `M_LIMIT_EXCEEDED` and the `Retry-After`
            header MUST be set to the time of, or the time until, the scheduled send time of
            the user's next delayed event to be sent, rounded up to the nearest second.
          headers:
            Retry-After:
              description: |-
                The [`Retry-After`](https://www.rfc-editor.org/rfc/rfc9110#field.retry-after)
                header, which indicates either the time at which, or the number of seconds after
                which, the request MAY be retried.
              schema:
                type: string
                example: "1200"
          content:
            application/json:
              schema:
                $ref: definitions/errors/rate_limited.yaml
              examples:
                response:
                  value: {
                    "errcode": "M_LIMIT_EXCEEDED",
                    "error": "The maximum number of delayed events has been reached."
                  }
      tags:
        - Delayed events
  "/v1/delayed_events/{delayId}":
    get:
      x-addedInMatrixVersion: "1.20"
      summary: Get the details of a delayed event.
      description: |-
        Retrieves the details of a delayed event that was previously scheduled by the requesting user.
      operationId: getDelayedEvent
      security:
        - accessTokenBearer: []
      parameters:
        - $ref: '#/components/parameters/delayId'
      responses:
        "200":
          description: The details of the delayed event.
          content:
            application/json:
              schema:
                type: object
                properties:
                  delay_id:
                    type: string
                    description: The identifier of the delayed event.
                  room_id:
                    type: string
                    format: mx-room-id
                    pattern: "^!"
                    description: |-
                      The [room ID](/appendices/#room-ids) of the room that the delayed event
                      was scheduled to be sent in.
                  type:
                    type: string
                    description: The event type of the delayed event.
                  state_key:
                    type: string
                    description: |-
                      The state key of the delayed event if it is a state event. Absent
                      otherwise.
                  delay_ms:
                    type: integer
                    format: int64
                    description: |-
                      The delay in milliseconds as supplied when scheduling the delayed event
                      via the `delay_ms` request property of
                      [`PUT /rooms/{roomId}/delayed_event/{eventType}/{txnId}`](/client-server-api/#put_matrixclientv3roomsroomiddelayed_eventeventtypetxnid).
                  delayed_since_ts:
                    type: integer
                    format: int64
                    description: |-
                      The timestamp (in milliseconds since the unix epoch) when the delayed event
                      was scheduled or last restarted.
                  content:
                    type: object
                    description: |-
                      The content of the delayed event as supplied when scheduling the delayed
                      event via the `content` request property of
                      [`PUT /rooms/{roomId}/delayed_event/{eventType}/{txnId}`](/client-server-api/#put_matrixclientv3roomsroomiddelayed_eventeventtypetxnid).
                  finalised:
                    type: object
                    title: DelayedEventFinalisation
                    description: |-
                      If the delayed event has been sent or cancelled, details of how this happened.
                      Otherwise, absent.
                    properties:
                      error:
                        allOf:
                          - $ref: definitions/errors/error.yaml
                        description: |-
                          If the delayed event was cancelled due to an error when trying to send it,
                          the [standard error response](/client-server-api/#standard-error-response)
                          of the error that prevented the delayed event from being sent. Otherwise,
                          absent.
                      event_id:
                        type: string
                        format: mx-event-id
                        pattern: "^\\$"
                        description: |-
                          If the delayed event was sent, the [event ID](/appendices/#event-ids) of the event.
                          Otherwise, absent.
                      finalised_ts:
                        type: integer
                        format: int64
                        description: |-
                          The timestamp (in milliseconds since the unix epoch) when the delayed event was
                          sent or cancelled.
                    required:
                      - finalised_ts
                required:
                  - delay_id
                  - room_id
                  - type
                  - delay_ms
                  - delayed_since_ts
                  - content
              examples:
                response:
                  value: {
                    "delay_id": "1234567890",
                    "room_id": "!636q39766251:example.com",
                    "type": "m.room.message",
                    "delay_ms": 60000,
                    "delayed_since_ts": 1758546000000,
                    "content": {
                      "msgtype": "m.text",
                      "body": "hello"
                    },
                    "finalised": {
                      "event_id": "$YUwRidLecu:example.com",
                      "finalised_ts": 1758546060052
                    }
                  }
        "404":
          $ref: '#/components/responses/notFound'
        "429":
          $ref: '#/components/responses/rateLimited'
      tags:
        - Delayed events
  "/v1/delayed_events/{delayId}/send":
    post:
      x-addedInMatrixVersion: "1.20"
      summary: Send a scheduled delayed event immediately.
      description: |-
        Sends a scheduled delayed event immediately instead of waiting for its
        scheduled send time.

        If the delayed event cannot be sent due to an error, the homeserver MUST
        respond with the same HTTP status code and [standard error response](/client-server-api/#standard-error-response)
        that would have been given when sending the event with either
        [`PUT /rooms/{roomId}/send/{eventType}/{txnId}`](/client-server-api/#put_matrixclientv3roomsroomidsendeventtypetxnid)
        or [`PUT /rooms/{roomId}/state/{eventType}/{stateKey}`](/client-server-api/#put_matrixclientv3roomsroomidstateeventtypestatekey).
        In this case, the homeserver SHOULD keep the delayed event scheduled.
      operationId: sendDelayedEvent
      security:
        - accessTokenBearer: []
      parameters:
        - $ref: '#/components/parameters/delayId'
      responses:
        "200":
          description: |-
            The delayed event has been sent or was already sent previously.
          content:
            application/json:
              schema:
                type: object
              examples:
                response:
                  value: {}
        "404":
          $ref: '#/components/responses/notFound'
        "409":
          description: |-
            The delayed event has already been cancelled and cannot be sent.
          content:
            application/json:
              schema:
                $ref: definitions/errors/error.yaml
              examples:
                response:
                  value: {
                    "errcode": "M_UNKNOWN",
                    "error": "The delayed event has already been cancelled."
                  }
        "429":
          $ref: '#/components/responses/rateLimited'
      tags:
        - Delayed events
  "/v1/delayed_events/{delayId}/cancel":
    post:
      x-addedInMatrixVersion: "1.20"
      summary: Cancel a scheduled delayed event.
      description: |-
        Cancels a scheduled delayed event so that it is never sent.
      operationId: cancelDelayedEvent
      security:
        - accessTokenBearer: []
      parameters:
        - $ref: '#/components/parameters/delayId'
      responses:
        "200":
          description: |-
            The delayed event has been cancelled or was already cancelled
            before.
          content:
            application/json:
              schema:
                type: object
              examples:
                response:
                  value: {}
        "404":
          $ref: '#/components/responses/notFound'
        "409":
          description: |-
            The delayed event has already been sent and cannot be cancelled.
          content:
            application/json:
              schema:
                $ref: definitions/errors/error.yaml
              examples:
                response:
                  value: {
                    "errcode": "M_UNKNOWN",
                    "error": "The delayed event has already been sent."
                  }
        "429":
          $ref: '#/components/responses/rateLimited'
      tags:
        - Delayed events
  "/v1/delayed_events/{delayId}/restart":
    post:
      x-addedInMatrixVersion: "1.20"
      summary: Restart the timer of a scheduled delayed event.
      description: |-
        Resets the scheduled send time of a delayed event to be the
        current time plus the delayed event's original `delay_ms`.
      operationId: restartDelayedEvent
      security:
        - accessTokenBearer: []
      parameters:
        - $ref: '#/components/parameters/delayId'
      responses:
        "200":
          description: The timer of the delayed event has been restarted.
          content:
            application/json:
              schema:
                type: object
              examples:
                response:
                  value: {}
        "404":
          $ref: '#/components/responses/notFound'
        "409":
          description: |-
            The delayed event has already been sent or cancelled and cannot
            be restarted.
          content:
            application/json:
              schema:
                $ref: definitions/errors/error.yaml
              examples:
                response:
                  value: {
                    "errcode": "M_UNKNOWN",
                    "error": "The delayed event has already been sent."
                  }
        "429":
          $ref: '#/components/responses/rateLimited'
      tags:
        - Delayed events
servers:
  - url: "{protocol}://{hostname}{basePath}"
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
      hostname:
        default: localhost:8008
      basePath:
        default: /_matrix/client
components:
  securitySchemes:
    accessTokenBearer:
      $ref: definitions/security.yaml#/accessTokenBearer
  parameters:
    delayId:
      in: path
      name: delayId
      description: |-
        The identifier of the delayed event as obtained from the `delay_id` property in the response of
        [`PUT /rooms/{roomId}/delayed_event/{eventType}/{txnId}`](/client-server-api/#put_matrixclientv3roomsroomiddelayed_eventeventtypetxnid).
      required: true
      example: "1234567890"
      schema:
        type: string
  responses:
    notFound:
      description: |-
        No delayed event with the given `delay_id` that was scheduled by the requesting
        user could be found. A [standard error response](/client-server-api/#standard-error-response)
        will be returned with the `errcode` `M_NOT_FOUND`.
      content:
        application/json:
          schema:
            $ref: definitions/errors/error.yaml
          examples:
            response:
              value: {
                "errcode": "M_NOT_FOUND",
                "error": "Delayed event not found."
              }
    rateLimited:
      description: This request was rate-limited.
      content:
        application/json:
          schema:
            $ref: definitions/errors/rate_limited.yaml
