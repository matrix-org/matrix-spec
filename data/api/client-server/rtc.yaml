openapi: 3.1.0
info:
  title: Matrix Client-Server MatrixRTC API
  version: 1.0.0
paths:
  /rtc/transports:
    get:
      x-addedInMatrixVersion: "1.20"
      summary: Get the MatrixRTC transports supported by the homeserver.
      description: |-
        Retrieves the MatrixRTC transport types that the homeserver supports,
        along with any potentially required connection details.
      operationId: getRtcTransports
      security:
        - accessTokenBearer: []
      responses:
        "200":
          description: The transports supported by the homeserver.
          content:
            application/json:
              schema:
                type: object
                properties:
                  transports:
                    type: array
                    description: |-
                      The transports the homeserver supports, ordered descendingly
                      by the server's preference.
                    items:
                      type: object
                      title: Transport
                      description: |-
                        Details on a specific transport.
                      properties:
                        type:
                          type: string
                          description: |-
                            The globally unique transport identifier.
                            
                            MUST follow the [Common Namespaced Identifier Grammar](/appendices#common-namespaced-identifier-grammar).
                      additionalProperties:
                        description: Additional properties based on the transport `type`.
                      required:
                        - type
                required:
                  - transports
              examples:
                response:
                  value: {
                    "transports": [
                      {
                        "type": "org.example.transport",
                        "org.example.url": "wss://transport.example.org"
                      }
                    ]
                  }
        "429":
          description: This request was rate-limited.
          content:
            application/json:
              schema:
                $ref: definitions/errors/rate_limited.yaml
      tags:
        - MatrixRTC
servers:
  - url: "{protocol}://{hostname}{basePath}"
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
      hostname:
        default: localhost:8008
      basePath:
        default: /_matrix/client/v1
components:
  securitySchemes:
    accessTokenBearer:
      $ref: definitions/security.yaml#/accessTokenBearer
